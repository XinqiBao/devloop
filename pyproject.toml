[project]
name = "devloop"
version = "0.1.0"
description = "AI autonomous development loop scheduler"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
devloop = "src.scheduler:main"
