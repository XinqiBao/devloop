# devloop configuration
# Copy to ~/.config/devloop/config.yaml and fill in your values.
# Environment variables can be referenced as ${VAR_NAME}.

scheduler:
  # How often to run (hours). Aligned with Claude Pro 5-hour quota refresh.
  interval_hours: 5
  # Hard timeout per cycle in minutes. Kills execution if exceeded.
  max_runtime_minutes: 60

worker:
  # Maximum Claude Code CLI turns per task.
  max_turns: 30
  # Claude model to use.
  model: claude-opus-4-6

projects:
  - name: MyProject
    # GitHub owner/repo
    repo: owner/repo
    # Local clone path on the deployment host
    local_path: /home/agent/repos/MyProject
    # Only pick issues with these labels (empty = all issues)
    labels_include: [auto, devloop]
    # Never pick issues with these labels
    labels_exclude: [needs-discussion, wontfix]

notifications:
  telegram:
    # Create a bot via @BotFather, paste token here
    bot_token: ${TG_BOT_TOKEN}
    # Your personal Telegram user ID (not username)
    # Get it by messaging @userinfobot on Telegram
    chat_id: ${TG_CHAT_ID}
  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    smtp_user: ${SMTP_USER}
    smtp_pass: ${SMTP_PASS}
    from_addr: devloop@example.com
    to_addr: you@example.com

monitor:
  # Model to use when primary quota is exhausted. null = skip cycle instead.
  fallback_model: null
